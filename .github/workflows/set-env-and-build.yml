name: Build (write env from secrets)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create env file from repository secrets
        run: |
          echo "Creating .env.production from repo secrets"
          cat > .env.production <<EOF
          VITE_BOOK_ID=${{ secrets.VITE_BOOK_ID }}
          VITE_GOOGLE_FILE_ID=${{ secrets.VITE_GOOGLE_FILE_ID }}
          VITE_GOOGLE_API_KEY=${{ secrets.VITE_GOOGLE_API_KEY }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Deploy via `npm run deploy`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # set committer identity for the runner so gh-pages can commit
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          # configure origin to push using the GITHUB_TOKEN
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          npm run deploy
